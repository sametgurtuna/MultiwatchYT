<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiwatch</title>
    <!-- Light Mode CSS -->
    <style id="lightMode">
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f3f3f3;
        color: #333;
        transition: background-color 0.3s, color 0.3s;
      }

      header {
        background-color: #333;
        color: #fff;
        padding: 20px;
        text-align: center;
        position: relative;
        transition: background-color 0.3s, color 0.3s;
      }

      h1 {
        margin: 0;
      }

      input[type="text"] {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin-right: 10px;
      }

      button {
        padding: 8px 15px;
        background-color: #4caf50;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }

      #videoContainer {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        width: 100vw;
      }

      .video {
        margin: 10px;
        position: relative;
        flex: 1 1 auto;
      }

      .video-player {
        width: 100%;
        height: 400px;
        border: none;
      }

      .closeButton {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: rgba(0,0,0,0.6);
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        border-radius: 4px;
        line-height: 1;
        padding: 2px 6px;
      }

      .muteButton {
        position: absolute;
        top: 5px;
        right: 45px;
        background-color: rgba(0,0,0,0.6);
        border: none;
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        border-radius: 4px;
        padding: 3px 7px;
      }

      .muteButton:hover,
      .closeButton:hover {
        background-color: rgba(0,0,0,0.85);
      }

      /* Ayar Düğmesi */
      .settingsButton {
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 5px;
        cursor: pointer;
      }
    </style>
    <!-- Dark Mode CSS -->
    <style id="darkMode">
      body.dark-mode {
        background-color: #333;
        color: #fff;
      }

      body.dark-mode header {
        background-color: #333;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Multiwatch</h1>
      <input type="text" id="youtubeLink" placeholder="YouTube Video URL" />
      <button onclick="addVideo()">Add Video</button>
      <!-- Ayar Düğmesi -->
      <div
        class="settingsButton"
        id="settingsButton"
        onclick="toggleDarkMode()"
      >
        <span id="modeIcon">🌙</span>
      </div>
    </header>
    <main id="videoContainer">
      <!-- Burası videoların görüntüleneceği bölüm -->
    </main>

    <!-- YouTube IFrame Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
      var players = {}; // playerId -> YT.Player instance
      var playerCounter = 0;

      // YouTube IFrame API yüklendiğinde çağrılır (global callback gerekli)
      function onYouTubeIframeAPIReady() {
        // API hazır; mevcut placeholder div'leri player'a dönüştür
        // (Sayfa yüklenirken video eklenmediği için genellikle boş geçer)
      }

      function addVideo() {
        var youtubeLink = document.getElementById("youtubeLink").value.trim();
        if (!youtubeLink) return;

        var videoId = extractVideoId(youtubeLink);
        if (!videoId) {
          alert("Geçerli bir YouTube linki girin.");
          return;
        }

        var main = document.getElementById("videoContainer");

        // Her player için benzersiz id
        var playerId = "ytplayer-" + (++playerCounter);

        // Player için placeholder div
        var playerDiv = document.createElement("div");
        playerDiv.id = playerId;
        playerDiv.classList.add("video-player");

        // Kapat butonu
        var closeButton = document.createElement("button");
        closeButton.innerText = "×";
        closeButton.classList.add("closeButton");
        closeButton.addEventListener("click", function () {
          // Player'ı durdur ve temizle
          if (players[playerId]) {
            players[playerId].destroy();
            delete players[playerId];
          }
          main.removeChild(div);
          adjustVideoSizes();
        });

        // Ses aç/kapat butonu
        var muteButton = document.createElement("button");
        muteButton.innerText = "🔊";
        muteButton.classList.add("muteButton");
        muteButton.addEventListener("click", function () {
          var player = players[playerId];
          if (!player) return;
          if (player.isMuted()) {
            player.unMute();
            muteButton.innerText = "🔊";
          } else {
            player.mute();
            muteButton.innerText = "🔇";
          }
        });

        var div = document.createElement("div");
        div.classList.add("video");
        div.appendChild(playerDiv);
        div.appendChild(muteButton);
        div.appendChild(closeButton);

        main.appendChild(div);
        adjustVideoSizes();

        // YouTube Player oluştur
        players[playerId] = new YT.Player(playerId, {
          videoId: videoId,
          playerVars: {
            autoplay: 1,
            enablejsapi: 1
          },
          events: {
            onReady: function (event) {
              // Player hazır; buton durumunu senkronize et
              if (event.target.isMuted()) {
                muteButton.innerText = "🔇";
              } else {
                muteButton.innerText = "🔊";
              }
            }
          }
        });

        // Input'u temizle
        document.getElementById("youtubeLink").value = "";
      }

      function extractVideoId(url) {
        var videoId = "";
        if (url.includes("v=")) {
          videoId = url.split("v=")[1];
          var ampersandPosition = videoId.indexOf("&");
          if (ampersandPosition !== -1) {
            videoId = videoId.substring(0, ampersandPosition);
          }
        } else if (url.includes("youtu.be/")) {
          videoId = url.split("youtu.be/")[1];
          var slashPosition = videoId.indexOf("/");
          if (slashPosition !== -1) {
            videoId = videoId.substring(0, slashPosition);
          }
          // query string varsa temizle
          var qPosition = videoId.indexOf("?");
          if (qPosition !== -1) {
            videoId = videoId.substring(0, qPosition);
          }
        }
        return videoId;
      }

      function adjustVideoSizes() {
        var videos = document.querySelectorAll(".video");
        var numVideos = videos.length;

        if (numVideos === 1) {
          videos.forEach(function (video) {
            video.style.flex = "1 1 100%";
          });
        } else if (numVideos === 2) {
          videos.forEach(function (video) {
            video.style.flex = "1 1 50%";
          });
        } else {
          videos.forEach(function (video) {
            video.style.flex = "1 1 33.33%";
          });
        }
      }

      // Dark Mode Toggle
      function toggleDarkMode() {
        var body = document.body;
        var modeIcon = document.getElementById("modeIcon");

        body.classList.toggle("dark-mode");
        if (body.classList.contains("dark-mode")) {
          modeIcon.innerHTML = "☀️";
        } else {
          modeIcon.innerHTML = "🌙";
        }
      }
    </script>
  </body>
</html>
