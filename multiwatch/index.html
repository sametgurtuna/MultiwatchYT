<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Watch multiple YouTube, Twitch, and Kick streams simultaneously in a customizable grid layout." />
    <meta name="theme-color" content="#0f0f13" />

    <!-- Open Graph -->
    <meta property="og:title"       content="Multiwatch — Multi-stream viewer" />
    <meta property="og:description" content="Watch YouTube, Twitch, and Kick streams side by side." />
    <meta property="og:type"        content="website" />

    <!-- Prevent FOUC: apply saved theme before paint -->
    <script>
      try {
        const t = localStorage.getItem('multiwatch_theme');
        if (t) document.documentElement.setAttribute('data-theme', t);
        else if (window.matchMedia('(prefers-color-scheme: light)').matches)
          document.documentElement.setAttribute('data-theme', 'light');
      } catch(e) {}
    </script>

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>▶▶</text></svg>" />
    <title>Multiwatch</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
